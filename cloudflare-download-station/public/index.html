<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>应用插件下载站 · 超炫酷资源分享平台</title>
  <meta name="description" content="超炫酷应用及插件下载分享平台，支持评论、点赞、下载计数，管理员可上传资源。" />
  <!-- 网站图标（闪电 emoji） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<!-- data-theme 控制配色主题：purple 霓虹紫 / blue 科技蓝 / green 暗夜绿 -->
<body data-theme="purple">

  <!-- ============ 1 秒炫酷加载动画（进入网站时出现） ============ -->
  <div id="loading" class="loading">
    <div class="loading-inner">
      <div class="loading-logo">⚡</div>
      <div class="loading-text">应用插件下载站</div>
      <div class="loading-bar"><i></i></div>
      <div class="loading-sub">LOADING...</div>
    </div>
  </div>

  <!-- ============ 顶部导航栏 ============ -->
  <header class="navbar">
    <div class="navbar-inner">
      <!-- Logo -->
      <a href="#/" class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-text">下载站</span>
      </a>

      <!-- 主导航链接 -->
      <nav class="nav-links" id="nav-links">
        <a href="#/" data-route="/">首页</a>
        <a href="#/apps" data-route="/apps">应用</a>
        <a href="#/plugins" data-route="/plugins">插件</a>
        <a href="#/messages" data-route="/messages">留言建议</a>
        <a href="#/contact" data-route="/contact">联系我</a>
        <a href="#/history" data-route="/history">历史</a>
        <a href="#/admin" data-route="/admin" id="nav-admin" class="hidden">管理后台</a>
      </nav>

      <!-- 右侧：搜索 + 主题切换 + 登录状态 -->
      <div class="nav-actions">
        <form id="search-form" class="search-box">
          <input id="search-input" type="text" placeholder="搜索应用 / 插件..." maxlength="50" />
          <button type="submit" title="搜索">🔍</button>
        </form>

        <div class="theme-switch" id="theme-switch" title="切换主题">
          <span class="theme-dot" data-theme="purple"></span>
          <span class="theme-dot" data-theme="blue"></span>
          <span class="theme-dot" data-theme="green"></span>
        </div>

        <div class="user-area" id="user-area">
          <!-- 登录后由 JS 动态渲染 -->
        </div>
      </div>
    </div>
  </header>

  <!-- ============ 页面主体（由 JS 按路由渲染） ============ -->
  <main id="app"></main>

  <!-- ============ 页脚 ============ -->
  <footer class="footer">
    <div class="footer-inner">
      <p>⚡ 应用插件下载站 · 超炫酷资源分享平台</p>
      <p class="footer-muted">支持评论 · 点赞 · 下载计数 · 管理员上传</p>
    </div>
  </footer>

  <!-- ============ 轻提示浮层 ============ -->
  <div id="toast" class="toast"></div>

  <!-- 脚本按依赖顺序加载：api 封装 → 页面逻辑 → 启动入口 -->
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
